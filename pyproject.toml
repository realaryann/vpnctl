[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vpnctl"
version = "0.1.0"
description = "Manage a personal WireGuard VPN"
requires-python = ">=3.11"
dependencies = ["typer>=0.27.2,<1"]

[project.scripts]
vpnctl = "vpnctl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
